name: image

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.version.outputs.tags }}
      rc: ${{ steps.version.outputs.rc }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: version
        name: Check the tag against the package version
        run: |
          python3 -m tools.release_version check "$GITHUB_REF_NAME"
          tags="$(python3 -m tools.release_version tags "$GITHUB_REF_NAME" | paste -sd ' ' -)"
          if [ -z "$tags" ]; then echo "no image tags for $GITHUB_REF_NAME"; exit 1; fi
          rc=true
          for tag in $tags; do
            if [ "$tag" = latest ]; then rc=false; fi
          done
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags=$tags"
            echo "rc=$rc"
            echo "version=${tags%% *}"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        name: Build and push the exact version to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          build-args: |
            SKOPAX_VERSION=${{ needs.version.outputs.version }}
            COMMIT_ID=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Attest the GHCR image
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  layer-smoke:
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      mongo:
        image: mongo:8.0.4@sha256:aaad67f2dca93148e5343c03210bcfc89a0107516a4756bfa018acd6579e5b18
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      SKOPAX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the example layer on the pushed image
        run: docker build --build-arg BASE_IMAGE="$IMAGE" --build-arg SKOPAX_VERSION="$SKOPAX_VERSION" -t skopax-hello:smoke examples/hello-plugin
      - name: Build the Couchbase and managed Redis example layers on top
        run: |
          docker build --build-arg BASE_IMAGE=skopax-hello --build-arg SKOPAX_VERSION=smoke -t skopax-couchbase:smoke examples/couchbase-plugin
          docker build --build-arg BASE_IMAGE=skopax-couchbase --build-arg SKOPAX_VERSION=smoke -t skopax-examples:smoke examples/managed-redis-plugin
      - name: Wait for Mongo
        env:
          MONGO: ${{ job.services.mongo.id }}
        run: |
          for _ in $(seq 60); do
            if docker exec "$MONGO" mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "Mongo never came up"
          exit 1
      - name: Run the layer and check the hello plug-in
        env:
          NETWORK: ${{ job.services.mongo.network }}
        run: |
          SKOPAX_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SKOPAX_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SKOPAX_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$SKOPAX_TOKEN"
          echo "::add-mask::$SKOPAX_SECRET_KEY"
          echo "::add-mask::$SKOPAX_ADMIN_PASSWORD"
          export SKOPAX_TOKEN SKOPAX_SECRET_KEY SKOPAX_ADMIN_PASSWORD
          docker run -d --name skopax-smoke --network "$NETWORK" -p 127.0.0.1:8080:8080 \
            -e MONGO_URI=mongodb://mongo:27017/skopax -e SKOPAX_BASE_URL=http://localhost:8080 -e SKOPAX_TIMEZONE=UTC \
            -e SKOPAX_ADMIN_EMAIL=admin@example.com -e SKOPAX_ADMIN_PASSWORD \
            -e SKOPAX_TOKEN -e SKOPAX_SECRET_KEY skopax-examples:smoke
          up=0
          for _ in $(seq 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' skopax-smoke)" != true ]; then echo "the app container stopped"; exit 1; fi
            if curl --max-time 10 -fsS http://127.0.0.1:8080/actuator/health/liveness >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != 1 ]; then echo "the app never came up"; exit 1; fi
          curl --max-time 10 -fsS -H "Authorization: Bearer $SKOPAX_TOKEN" http://127.0.0.1:8080/api/admin/plugins \
            | python3 -c 'import json, sys; p = {x["id"]: x for x in json.load(sys.stdin)["plugins"]}; h = p["hello"]; print(h["id"], h.get("state"), h.get("reason")); assert h.get("state") == "ok", h.get("state"); assert all(p[i].get("state") == "ok" for i in ("couchbase", "managed-redis")), {i: p[i].get("state") for i in ("couchbase", "managed-redis")}'
          icon="$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/plugins/hello/icon.svg)"
          echo "icon $icon"
          [ "$icon" = 200 ]
          for plugin in couchbase managed-redis; do
            icon="$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/plugins/$plugin/icon.svg")"
            echo "$plugin icon $icon"
            [ "$icon" = 200 ]
          done
      - name: Show the app log
        if: failure()
        run: docker logs skopax-smoke 2>&1 | tail -n 100
      - name: Remove the smoke container
        if: always()
        run: docker rm -f skopax-smoke

  scan:
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: grype
        name: Scan the pushed digest for fixable High and Critical findings
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ needs.version.outputs.image }}@${{ needs.build.outputs.digest }}
          grype-version: v0.121.1
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: Upload the scan to code scanning
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: image-release

  promote:
    needs:
      - version
      - build
      - layer-smoke
      - scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      VERSION: ${{ needs.version.outputs.version }}
      TAGS: ${{ needs.version.outputs.tags }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add the moving tags on GHCR
        run: |
          args=()
          for tag in $TAGS; do
            if [ "$tag" != "$VERSION" ]; then args+=(--tag "$IMAGE:$tag"); fi
          done
          if [ "${#args[@]}" = 0 ]; then echo "no moving tags for $VERSION"; exit 0; fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: Log in to Docker Hub
        if: needs.version.outputs.rc == 'false' && env.HUB_USER != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Hub mirror skipped
        if: needs.version.outputs.rc == 'false' && env.HUB_USER == ''
        run: echo "::notice::No Docker Hub secrets in the release environment, so $VERSION is on GHCR only"
      - name: Copy the release to Docker Hub
        if: needs.version.outputs.rc == 'false' && env.HUB_USER != ''
        run: |
          args=()
          for tag in $TAGS; do
            args+=(--tag "docker.io/skopax/skopax:$tag")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
