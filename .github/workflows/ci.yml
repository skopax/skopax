name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.8"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22"
          package-manager-cache: false
      - run: uv python install 3.15
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -n auto
      - name: Preset checks for promtool
        run: uv run --frozen python -m tests.presets_promtool "$RUNNER_TEMP/presets"
      - name: Preset checks in promtool
        run: docker run --rm -v "$RUNNER_TEMP/presets:/work:ro" -w /work --entrypoint promtool "$PROMETHEUS_IMAGE" test rules presets-test.yml
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218

  page-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        zone:
          - UTC
          - Asia/Tokyo
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22"
          package-manager-cache: false
      - run: npm ci
        working-directory: tests/page
      - name: Page suites
        run: node tests/page/run.js
        env:
          SKOPAX_TEST_TZ: ${{ matrix.zone }}
          SKOPAX_TEST_SHARD: ${{ matrix.shard }}/4

  pages:
    needs: page-suites
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Every page shard passed
        run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.page-suites.result }}

  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.8"
          enable-cache: false
      - run: uv python install 3.15
      - run: uv sync --frozen --no-dev
      - name: Licence gate on what ships
        run: .venv/bin/python -m tools.licences check --site .venv/lib/python3.15/site-packages --out "$RUNNER_TEMP/notices"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
