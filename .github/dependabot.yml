version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directories:
      - /
      - /examples/hello-plugin
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker:
        group-by: dependency-name
  - package-ecosystem: npm
    directory: /tests/page
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
