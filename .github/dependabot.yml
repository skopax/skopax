version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: direct
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: docker
    directories:
      - /
      - /examples/hello-plugin
      - /examples/couchbase-plugin
      - /examples/managed-redis-plugin
      - /examples/batch-jobs-plugin
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        group-by: dependency-name
  - package-ecosystem: npm
    directory: /tests/page
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
