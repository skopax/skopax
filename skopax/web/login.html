<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>[[title]]</title>
<link rel="icon" type="image/svg+xml" href="/icons/mark.svg">
<style>
body{font-family:system-ui,sans-serif;max-width:420px;margin:10vh auto;padding:0 16px;line-height:1.5;color:#0e1420;background:#f2f4f7}
h1{font-size:1.3rem}
label{display:block;margin-top:14px;font-size:.9rem}
input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;font:inherit;color:inherit;background:transparent;border:1px solid #8a94a6;border-radius:6px}
button{margin-top:20px;padding:9px 16px;font:inherit;color:#fff;background:#1d58d4;border:0;border-radius:6px;cursor:pointer}
a{color:#1d58d4}
form button[type=submit]{width:100%;min-height:41px}
button:focus-visible{outline:3px solid #1d58d4;outline-offset:2px}
.sso-or{display:flex;align-items:center;gap:12px;margin:18px 0 0;font-size:.85rem;color:#5b6472}
.sso-or::before,.sso-or::after{content:"";flex:1 1 auto;border-top:1px solid #c9ced8}
.sso{margin-top:14px}
.sso-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;min-height:41px;padding:8px 12px;font:inherit;font-weight:600;color:#0e1420;text-decoration:none;background:#fff;border:1px solid #8a94a6;border-radius:6px}
.sso-btn:hover{background:#f6f8fb}
.sso-btn:focus-visible{outline:3px solid #1d58d4;outline-offset:2px}
.sso-ico{flex:none;display:block;width:20px;height:20px;object-fit:contain}
.sso-btn-microsoft{font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;color:#5e5e5e;background:#fff;border-color:#8c8c8c;border-radius:0}
.sso-btn-microsoft .sso-ico{width:21px;height:21px}
.error{margin-top:14px;padding:8px 10px;border-radius:6px;color:#8a1c1c;background:#fde8e8}
.wm-dark{display:none}
@media (prefers-color-scheme:dark){.wm-light{display:none}.wm-dark{display:block}body{color:#e6eaf0;background:#0a0d12}button{background:#3a6fe0}a{color:#79a6ff}.error{color:#ffb4b4;background:#3a1717}input{border-color:#4a5568}}
@media (prefers-color-scheme:dark){.sso-or{color:#9aa3b2}.sso-or::before,.sso-or::after{border-color:#2c3440}button:focus-visible{outline-color:#79a6ff}.sso-btn{color:#e6eaf0;background:#161b24;border-color:#4a5568}.sso-btn:hover{background:#1d2430}.sso-btn:focus-visible{outline-color:#79a6ff}.sso-btn-microsoft{color:#fff;background:#2f2f2f;border-color:#2f2f2f}}
.wordmark{display:block;margin-bottom:24px}
.wordmark svg{display:block;height:40px;width:auto}
.wordmark-text{font-size:1.6rem;font-weight:700}
.attribution{margin-top:40px;font-size:.8rem;text-align:center}
.attribution a{color:inherit;opacity:.7}
</style>
</head>
<body>
[[wordmark]]
<h1>[[title]]</h1>
[[error]]
<form method="post" action="/login">
<input type="hidden" name="next" value="[[nextvalue]]">
<label>[[email]]<input name="email" type="email" required maxlength="254" autocomplete="username" value="[[emailvalue]]"></label>
<label>[[password]]<input name="password" type="password" required maxlength="256" autocomplete="current-password"></label>
<button type="submit">[[submit]]</button>
</form>
[[sso]]
[[footer]]
</body>
</html>
