apiVersion: batch/v1
kind: Job
metadata:
  name: skopax-embed-model-fetch
  labels:
    app.kubernetes.io/name: skopax-embed-model-fetch
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skopax-embed-model-fetch
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fetch
          image: docker.io/library/alpine:3.21@sha256:bc21487101ae47172509130ee1092cc273a831968d64b617776d1f69c81e42ab
          command:
            - sh
            - -ec
            - |
              base=https://huggingface.co/intfloat/multilingual-e5-small/resolve/614241f622f53c4eeff9890bdc4f31cfecc418b3
              cat > /tmp/sums <<'SUMS'
              69137736cab8b8903a07fe8afaafdda25aac55415a12a55d1bffa9f581abf959  config.json
              0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  tokenizer.json
              a1d6bc8734a6f635dc158508bef000f8e2e5a759c7d92f984b2c86e5ff53425b  tokenizer_config.json
              d05497f1da52c5e09554c0cd874037a083e1dc1b9cfd48034d1c717f1afc07a7  special_tokens_map.json
              c6e29747481e8b5dd2b58401966aeac910de39092f90cda9a704b1545f902b04  modules.json
              948201d8329907aae938fa62f9ceeed53f5694dacc2b87b9f3b78b37ee986529  sentence_bert_config.json
              987f7a67a38fa564c849bb5d277c52ab9088a84368fc0be31a354125aebb12a0  1_Pooling/config.json
              ca456c06b3a9505ddfd9131408916dd79290368331e7d76bb621f1cba6bc8665  onnx/model.onnx
              SUMS
              while read -r sum file; do
                mkdir -p "/model/$(dirname "$file")"
                wget -q -O "/model/$file.part" "$base/$file"
                if ! echo "$sum  /model/$file.part" | sha256sum -c - >/dev/null; then
                  echo "sha256 mismatch for $file" >&2
                  rm -f "/model/$file.part"
                  exit 1
                fi
                mv "/model/$file.part" "/model/$file"
                echo "ok $file"
              done < /tmp/sums
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: model
              mountPath: /model
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: skopax-embed-model
        - name: tmp
          emptyDir: {}
