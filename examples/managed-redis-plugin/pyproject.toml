[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "skopax-managed-redis"
version = "0.1.0"
description = "Example plug-in for Skopax: watches Redis instances you cannot reach directly through a Grafana datasource."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"

[project.entry-points."skopax.plugins"]
managed-redis = "skopax_managed_redis:PLUGIN"

[tool.uv.build-backend]
module-name = "skopax_managed_redis"
module-root = ""
