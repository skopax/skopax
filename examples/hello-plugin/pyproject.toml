[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "skopax-hello"
version = "0.1.0"
description = "Example plug-in for Skopax: opens a card when an address does not answer HTTP 200."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"

[project.entry-points."skopax.plugins"]
hello = "skopax_hello:PLUGIN"

[tool.uv.build-backend]
module-name = "skopax_hello"
module-root = ""
